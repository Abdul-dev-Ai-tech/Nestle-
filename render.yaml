# Render Blueprint: the FastAPI backend on Render's free plan (Docker).
# Render dashboard > New > Blueprint > pick this repository. Values marked `sync: false` are asked for
# during setup and stay in Render (never in GitHub). See docs/DEPLOYMENT_FREE.md.
services:
  - type: web
    name: nestle-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./deployment/docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      # --- fixed settings ---
      - key: ENV
        value: staging                  # staging keeps the simulated AI clearly labelled; production refuses it
      - key: WEB_CONCURRENCY
        value: "1"                      # free plan has 512 MB RAM
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DEV_RETURN_RESET_LINK
        value: "false"
      - key: AI_MODE
        value: simulation
      - key: DOOR_MODE
        value: simulation
      - key: HARDWARE_DOORS_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SEED_DEMO
        value: "true"                   # demo factory + demo users + sample history (once). Set false for real use.
      # --- generated by Render ---
      - key: SECRET_KEY
        generateValue: true
      - key: CAMERA_CREDENTIALS_KEY
        generateValue: true
      # --- you enter these in the Render dashboard ---
      - key: DATABASE_URL               # Neon connection string (postgresql://...); the driver is fixed automatically
        sync: false
      - key: FRONTEND_URL               # https://<your-app>.vercel.app  (used in password-reset links)
        sync: false
      - key: CORS_ORIGINS               # same Vercel address
        sync: false
      - key: ADMIN_EMAIL                # your Super Admin account, created on first start
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_PASSWORD              # password for the demo accounts (super.admin@example.com ...)
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD              # Gmail App Password (16 letters, no spaces)
        sync: false
      - key: SMTP_FROM
        sync: false
