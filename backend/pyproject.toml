[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008", "E501", "E731", "B904"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/db/seed.py" = ["B007"]
